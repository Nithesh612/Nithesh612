<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile Banner Preview</title>
  <style>
    body {
      margin: 0;
      padding: 2rem 1.5rem;
      background: #030712;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 1.8rem;
      margin-bottom: 0.5rem;
    }
    p {
      color: #94A3B8;
      margin-bottom: 2rem;
    }
    .card {
      max-width: 1180px;
      width: 100%;
      margin-bottom: 2.5rem;
    }
    .badge {
      font-family: monospace;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: #22D3EE;
    }
    .container {
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .container img {
      width: 100%;
      display: block;
    }
    .light-wrap {
      background: #F1F5F9;
      padding: 1.5rem;
      border-radius: 24px;
    }
  </style>
</head>
<body>
  <h1>⚡ GitHub Profile Banner Preview</h1>
  <p>Clean, crisp text with glow filter removed and text changed to <b>Full Stack Developer &amp; AI</b></p>

  <div class="card">
    <div class="badge">● DARK MODE (dark.svg)</div>
    <div class="container">
      <img src="dark.svg" alt="Dark Mode Banner">
    </div>
  </div>

  <div class="card">
    <div class="badge" style="color: #2563EB;">● LIGHT MODE (light.svg)</div>
    <div class="light-wrap">
      <div class="container" style="box-shadow: 0 10px 30px rgba(0,0,0,0.1);">
        <img src="light.svg" alt="Light Mode Banner">
      </div>
    </div>
  </div>
</body>
</html>
